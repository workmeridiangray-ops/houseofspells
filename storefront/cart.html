<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Your Cart | House of Spells</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --midnight: #0E0B1D;
    --surface: #17122A;
    --surface-2: #1E1836;
    --amethyst: #8B6FD8;
    --amethyst-bright: #A489E8;
    --moon-gold: #F2D3A1;
    --lavender: #DCC8FF;
    --ivory: #F9F6EF;
    --ivory-dim: rgba(249, 246, 239, 0.62);
    --ivory-faint: rgba(249, 246, 239, 0.38);
    --hairline: rgba(220, 200, 255, 0.14);
    --success: #7FC99A;
    --font-display: 'Fraunces', serif;
    --font-body: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--midnight); color: var(--ivory); font-family: var(--font-body);
    -webkit-font-smoothing: antialiased; padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  img { max-width: 100%; display: block; }
  :focus-visible { outline: 2px solid var(--amethyst-bright); outline-offset: 3px; border-radius: 4px; }
  .wrap { max-width: 1100px; margin: 0 auto; padding-left: clamp(20px, 4vw, 56px); padding-right: clamp(20px, 4vw, 56px); }

  header {
    position: sticky; top: 0; z-index: 40; background: rgba(14, 11, 29, 0.88);
    backdrop-filter: blur(14px); border-bottom: 1px solid var(--hairline);
  }
  .header-inner { display: flex; align-items: center; justify-content: space-between; height: 76px; }
  .logo { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-size: 21px; font-weight: 500; }
  .icon-btn { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 10px; color: var(--ivory-dim); position: relative; }
  .icon-btn:hover { background: var(--surface-2); color: var(--ivory); }
  .cart-count { position: absolute; top: 3px; right: 3px; width: 15px; height: 15px; border-radius: 50%; background: var(--amethyst); color: var(--midnight); font-size: 9px; font-weight: 600; display: flex; align-items: center; justify-content: center; }

  .page-head { padding: 40px 0 8px; }
  .page-head h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(28px, 3.4vw, 38px); }
  .page-head .step-count { color: var(--ivory-faint); font-size: 13.5px; margin-top: 6px; }

  .cart-layout { display: grid; grid-template-columns: 1fr 360px; gap: 40px; padding: 32px 0 72px; align-items: start; }

  .cart-list { display: flex; flex-direction: column; }
  .cart-row {
    display: grid; grid-template-columns: 92px 1fr auto; gap: 18px; align-items: center;
    padding: 20px 0; border-bottom: 1px solid var(--hairline);
  }
  .cart-row .thumb { width: 92px; height: 92px; border-radius: 12px; overflow: hidden; background: var(--surface); }
  .cart-row .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .cart-row .info .name { font-size: 14.5px; line-height: 1.4; margin-bottom: 8px; max-width: 40ch; }
  .cart-row .info .unit-price { font-size: 13px; color: var(--ivory-faint); }
  .cart-row .qty-block { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  .qty-stepper { display: flex; align-items: center; border: 1.5px solid var(--hairline); border-radius: 9px; overflow: hidden; }
  .qty-stepper button { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--ivory-dim); }
  .qty-stepper button:hover { background: var(--surface-2); }
  .qty-stepper .qty-num { width: 32px; text-align: center; font-size: 12.5px; font-weight: 600; }
  .line-total { font-family: var(--font-display); font-size: 17px; color: var(--moon-gold); }
  .remove-btn { font-size: 12px; color: var(--ivory-faint); }
  .remove-btn:hover { color: var(--ivory); }

  .empty-cart { text-align: center; padding: 72px 0; display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .empty-cart svg { color: var(--ivory-faint); opacity: 0.6; }
  .empty-cart p { color: var(--ivory-dim); font-size: 15px; }
  .btn-primary {
    display: inline-flex; align-items: center; gap: 9px; background: var(--amethyst); color: var(--midnight);
    font-weight: 600; font-size: 14px; padding: 13px 24px; border-radius: 100px; transition: background 0.15s ease;
  }
  .btn-primary:hover { background: var(--amethyst-bright); }

  .order-summary {
    background: var(--surface); border: 1px solid var(--hairline); border-radius: 16px; padding: 24px;
    position: sticky; top: 100px;
  }
  .order-summary h2 { font-size: 15px; font-weight: 600; margin-bottom: 18px; }
  .summary-row { display: flex; justify-content: space-between; font-size: 13.5px; color: var(--ivory-dim); padding: 9px 0; }
  .summary-row.total { border-top: 1px solid var(--hairline); margin-top: 8px; padding-top: 16px; font-size: 15px; color: var(--ivory); font-weight: 600; }
  .summary-row .amt { color: var(--ivory); }
  .summary-row.total .amt { font-family: var(--font-display); font-size: 21px; color: var(--moon-gold); font-weight: 400; }

  .promo-row { display: flex; gap: 8px; margin: 18px 0; }
  .promo-row input {
    flex: 1; background: var(--surface-2); border: 1.5px solid var(--hairline); border-radius: 9px;
    padding: 10px 14px; color: var(--ivory); font-size: 13px; font-family: inherit;
  }
  .promo-row input::placeholder { color: var(--ivory-faint); }
  .promo-row input:focus { outline: none; border-color: var(--amethyst); }
  .promo-apply-btn { padding: 10px 16px; border: 1.5px solid var(--hairline); border-radius: 9px; font-size: 12.5px; font-weight: 600; }
  .promo-apply-btn:hover { border-color: var(--amethyst); background: var(--surface-2); }
  .promo-msg { font-size: 12px; margin-top: -10px; margin-bottom: 14px; display: none; }
  .promo-msg.show { display: block; }
  .promo-msg.success { color: var(--success); }
  .promo-msg.error { color: #E8968B; }

  .btn-checkout {
    width: 100%; background: var(--amethyst); color: var(--midnight); font-weight: 600; font-size: 14.5px;
    padding: 15px; border-radius: 100px; text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-checkout:hover { background: var(--amethyst-bright); }
  .btn-checkout:disabled { opacity: 0.4; cursor: not-allowed; }

  .trust-note { display: flex; align-items: center; gap: 8px; justify-content: center; font-size: 11.5px; color: var(--ivory-faint); margin-top: 14px; }

  @media (max-width: 860px) {
    .cart-layout { grid-template-columns: 1fr; }
    .order-summary { position: static; }
  }
  @media (max-width: 560px) {
    .cart-row { grid-template-columns: 68px 1fr; }
    .cart-row .qty-block { grid-column: 1 / -1; flex-direction: row; justify-content: space-between; align-items: center; padding-top: 10px; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap header-inner">
    <a href="index.html" class="logo">
      <svg width="24" height="24" viewBox="0 0 26 26" fill="none"><path d="M14.5 3C10 3 6.5 6.8 6.5 11.5C6.5 16.2 10.3 20 15 20C17.2 20 19.2 19.1 20.6 17.7C19 20.9 15.7 23 12 23C6.5 23 2 18.5 2 13C2 7.5 6.5 3 12 3C12.9 3 13.7 3.1 14.5 3.3V3Z" fill="#DCC8FF"/></svg>
      House of Spells
    </a>
    <button class="icon-btn" aria-label="Cart">
      <svg width="18" height="18" viewBox="0 0 19 19" fill="none"><path d="M4 6h13l-1.3 8.2a2 2 0 0 1-2 1.7H7.3a2 2 0 0 1-2-1.7L4 6Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M6.5 6V5a3 3 0 0 1 6 0v1" stroke="currentColor" stroke-width="1.5"/></svg>
      <span class="cart-count" id="cartCount">0</span>
    </button>
  </div>
</header>

<div class="wrap page-head">
  <h1>Your cart</h1>
  <div class="step-count">Step 1 of 2 — Cart</div>
</div>

<div class="wrap cart-layout" id="cartLayout">
  <div class="cart-list" id="cartList"></div>

  <aside class="order-summary" id="orderSummary">
    <h2>Order summary</h2>
    <div class="summary-row"><span>Subtotal</span><span class="amt" id="sumSubtotal">₹0</span></div>
    <div class="summary-row"><span>Shipping</span><span class="amt" id="sumShipping">Free</span></div>
    <div class="summary-row total"><span>Total</span><span class="amt" id="sumTotal">₹0</span></div>

    <div class="promo-row">
      <input type="text" id="promoInput" placeholder="Promo code">
      <button class="promo-apply-btn" id="promoBtn">Apply</button>
    </div>
    <div class="promo-msg" id="promoMsg"></div>

    <a href="checkout.html" class="btn-checkout" id="checkoutBtn">
      Proceed to checkout
      <svg width="14" height="14" viewBox="0 0 15 15" fill="none"><path d="M3 7.5h9M8.5 3l4.5 4.5L8.5 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <div class="trust-note">
      <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><rect x="3" y="6.5" width="8" height="6" rx="1" stroke="currentColor" stroke-width="1.1"/><path d="M4.8 6.5V5a2.2 2.2 0 0 1 4.4 0v1.5" stroke="currentColor" stroke-width="1.1"/></svg>
      Secure checkout, encrypted end to end
    </div>
  </aside>
</div>

<script src="cart-shared.js"></script>
<script src="currency-shared.js"></script>
<script src="store.js"></script>
<script>
function render() {
  const items = Object.values(cart);
  const listEl = document.getElementById('cartList');
  const summaryEl = document.getElementById('orderSummary');

  if (items.length === 0) {
    listEl.innerHTML = `
      <div class="empty-cart">
        <svg width="52" height="52" viewBox="0 0 44 44" fill="none"><path d="M9 14h26l-2.6 16.4a4 4 0 0 1-4 3.4H15.6a4 4 0 0 1-4-3.4L9 14Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M15 14v-2a7 7 0 0 1 14 0v2" stroke="currentColor" stroke-width="1.4"/></svg>
        <p>Your cart is empty.<br>Add something that calls to you.</p>
        <a href="index.html" class="btn-primary">
          Continue shopping
          <svg width="14" height="14" viewBox="0 0 15 15" fill="none"><path d="M3 7.5h9M8.5 3l4.5 4.5L8.5 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
      </div>`;
    summaryEl.style.display = 'none';
    return;
  }

  summaryEl.style.display = 'block';
  listEl.innerHTML = items.map(i => `
    <div class="cart-row" data-id="${i.id}">
      <div class="thumb"><img src="${i.image}" alt="${i.name}"></div>
      <div class="info">
        <div class="name">${i.name}</div>
        <div class="unit-price">${fmtLocal(i.price)} each</div>
      </div>
      <div class="qty-block">
        <div class="line-total">${fmtLocal(i.price * i.qty)}</div>
        <div class="qty-stepper">
          <button aria-label="Decrease quantity" onclick="changeItemQty('${i.id}', -1); render();">−</button>
          <span class="qty-num">${i.qty}</span>
          <button aria-label="Increase quantity" onclick="changeItemQty('${i.id}', 1); render();">+</button>
        </div>
        <button class="remove-btn" onclick="removeItemFromCart('${i.id}'); render();">Remove</button>
      </div>
    </div>
  `).join('');

  const subtotal = cartSubtotal();
  const shippingFree = subtotal >= 999;
  const shippingCost = shippingFree ? 0 : 79;
  document.getElementById('sumSubtotal').textContent = fmtLocal(subtotal);
  document.getElementById('sumShipping').textContent = shippingFree ? 'Free' : fmtLocal(shippingCost);
  document.getElementById('sumTotal').textContent = fmtLocal(subtotal + shippingCost - promoDiscount);
}

let promoDiscount = 0;
document.getElementById('promoBtn').addEventListener('click', () => {
  const code = document.getElementById('promoInput').value.trim().toUpperCase();
  const msgEl = document.getElementById('promoMsg');
  if (code === 'MOONCHILD') {
    promoDiscount = 150;
    msgEl.textContent = '₹150 off applied';
    msgEl.className = 'promo-msg show success';
  } else if (code) {
    promoDiscount = 0;
    msgEl.textContent = 'Invalid or expired code';
    msgEl.className = 'promo-msg show error';
  }
  render();
});

render();
setTimeout(render, 1200); // re-render once async currency detection resolves
</script>

</body>
</html>
